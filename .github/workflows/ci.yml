name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src/lianli_lcd tests scripts/install-openai-limits.py
      - name: Test without hardware
        run: pytest -q
      - name: Check shell syntax
        run: bash -n scripts/*.sh scripts/protoc

  compatibility-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check patch against pinned CoolerControl source
        shell: bash
        run: |
          git clone --depth 1 --branch 4.3.1 https://github.com/codifryed/coolercontrol.git build/upstream
          test "$(git -C build/upstream rev-parse HEAD)" = b255e1e768eba4cec374acb0b463c942ee82d645
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/coolercontrol-4.3.1-plugin-lcd.patch"
