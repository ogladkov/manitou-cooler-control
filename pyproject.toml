[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coolercontrol-lianli-lcd"
version = "0.4.1"
description = "Native CoolerControl plugin for Lian Li TL LCD screens and RGB lighting"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "vendor/lian-li-linux-LICENSE", "vendor/tinyuz-LICENSE"]
dependencies = [
  "grpcio==1.78.0",
  "protobuf>=6.31.1,<7",
  "Pillow==12.1.0",
  "pyusb==1.3.1",
  "pycryptodome==3.23.0",
]

[project.optional-dependencies]
dev = ["grpcio-tools==1.78.0", "pytest==9.0.2", "ruff==0.15.1"]

[project.urls]
Repository = "https://github.com/ogladkov/manitou-cooler-control"
Issues = "https://github.com/ogladkov/manitou-cooler-control/issues"

[project.scripts]
cc-lianli-lcd = "lianli_lcd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["src/coolercontrol"]
line-length = 100
